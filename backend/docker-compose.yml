services:
  postgres:
    image: postgres:16-alpine
    container_name: fairwork-postgres
    environment:
      POSTGRES_USER: fairwork
      POSTGRES_PASSWORD: fairwork
      POSTGRES_DB: fairwork
    ports:
      - '5434:5432'
    volumes:
      - fairwork_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fairwork -d fairwork']
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  fairwork_pg_data:
